[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stealth-mesh"
version = "0.1.0"
description = "Simulation-first research framework for resilient wireless mesh networking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0,<47.0",
    "qrcode[pil]>=7.4,<9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "routing*", "ml*", "transport*", "security*", "radio*", "monitoring*", "simulation*"]
